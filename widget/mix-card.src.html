<style>
:root{--h:var(--tg-theme-hint-color);--s:var(--tg-theme-secondary-bg-color);--b:var(--tg-theme-button-color)}
p{margin:0}
.w{color:var(--h);font-size:.87em;margin-bottom:8px}
.tb{display:flex;gap:3px;background:var(--s);border-radius:10px;padding:3px;margin-bottom:12px}
.tb button{flex:1;border:0;background:none;color:var(--h);font:inherit;font-size:.87em;font-weight:600;padding:6px 0;border-radius:8px}
.tb .on{background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);box-shadow:0 1px 2px #0003}
.top{display:flex;gap:12px;align-items:center;touch-action:pan-y}
svg{width:96px;height:96px;flex:none}
.rim{fill:none;stroke:var(--h);stroke-width:1}
h3{margin:0 0 3px;font-size:1em;line-height:1.25;text-transform:uppercase}
.d{color:var(--h);font-size:.87em;line-height:1.3}
.k{display:flex;align-items:center;gap:3px;margin-top:6px;font-size:.8em;color:var(--h)}
.k i{width:10px;height:5px;border-radius:2px;background:var(--tg-theme-section-separator-color,var(--s))}
.k .f{background:var(--b)}
.k span{margin-left:4px}
.l{margin-top:10px}
.i{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--tg-theme-section-separator-color,var(--s))}
.i:first-child{border:0}
.i i{width:9px;height:9px;border-radius:50%;flex:none}
.i b{width:2.6em;flex:none;font-variant-numeric:tabular-nums}
.x{flex:1;min-width:0}
.n{display:flex;justify-content:space-between;gap:6px}
.n small{color:var(--h);white-space:nowrap}
.m{color:var(--h);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;gap:6px;margin-top:10px}
.bt button{border:0;border-radius:10px;height:40px;font:inherit;font-weight:600;color:var(--tg-theme-text-color);background:var(--s)}
.bt .o{flex:1;background:var(--b);color:var(--tg-theme-button-text-color)}
.bt .r{width:46px}
.bt .on{box-shadow:inset 0 0 0 2px var(--b)}
.st{min-height:1.2em;margin-top:6px;color:var(--h);font-size:.85em;text-align:center}
.ld{display:flex;flex-direction:column;align-items:center;padding:12px 0 4px;text-align:center}
.ld svg{animation:spin 2.4s linear infinite}
.ld b{margin-top:10px}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.ld svg{animation:none}}
</style>
<div id="a"></div>
<script>
const W = window.TelegramWidget || { onEvent() {}, request: () => Promise.reject({}) };
const A = document.getElementById('a');
const C = ['#f2994a', '#e0457b', '#f2c94c', '#27ae9a', '#a9744f', '#9b6dd6', '#4a90d9', '#6fbf4a'];
const K = ['', 'лёгкая', 'средне-лёгкая', 'средняя', 'средне-крепкая', 'крепкая'];
const PH = ['Смотрю, что есть в наличии', 'Подбираю сочетания', 'Считаю пропорции', 'Проверяю крепость'];
const E = { BUSY: 'Секунду, предыдущее ещё отправляется', RATE_LIMITED: 'Слишком часто, попробуйте чуть позже', TIMEOUT: 'Бот не ответил, попробуйте ещё раз', NOT_ALLOWED: 'Откройте чат с ботом' };
let S = null, P = {}, L = {}, cur = 0, busy = 0, tm = 0, ph = 0, x0 = null;

try { L = JSON.parse(localStorage.getItem('s')) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem('s', JSON.stringify(L)); } catch (e) {} };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => '&#' + c.charCodeAt(0) + ';');
const col = (p, j) => C[p[4] != null ? p[4] % 8 : j % 8];
const say = (t) => { const e = document.getElementById('st'); if (e) e.textContent = t; };
const pt = (r, a) => (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1);

function bowl(ps) {
  let a = -Math.PI / 2, s = '';
  for (const [j, p] of ps.entries()) {
    const b = a + (p[0] / 100) * 2 * Math.PI, g = ps.length > 1 ? 0.03 : 0, f = b - a > Math.PI ? 1 : 0;
    s += `<path fill="${col(p, j)}" d="M${pt(44, a + g)}A44 44 0 ${f} 1 ${pt(44, b - g)}L${pt(22, b - g * 2)}A22 22 0 ${f} 0 ${pt(22, a + g * 2)}Z"/>`;
    a = b;
  }
  return `<svg viewBox="-50 -50 100 100"><circle class="rim" r="48"/>${s}</svg>`;
}

function card() {
  const m = S.m[cur] || S.m[(cur = 0)], r = ((S.r || [])[cur]) || (L.r || {})[cur] || 0;
  const k = Math.max(0, Math.min(5, m.k | 0));
  let h = P.n ? `<p class="w">${esc(P.n)}</p>` : '';
  if (S.m.length > 1) h += '<div class="tb">' + S.m.map((x, i) => `<button class="${i == cur ? 'on' : ''}" onclick="tab(${i})">Микс ${i + 1}</button>`).join('') + '</div>';
  h += `<div class="top" onpointerdown="x0=event.clientX" onpointerup="sw(event.clientX)">${bowl(m.p)}<div><h3>${esc(m.t)}</h3>`;
  const d = (P.d || [])[cur];
  if (d) h += `<p class="d">${esc(d)}</p>`;
  if (k) h += '<div class="k">' + [1, 2, 3, 4, 5].map((i) => `<i class="${i <= k ? 'f' : ''}"></i>`).join('') + `<span>${K[k]}</span></div>`;
  h += '</div></div><div class="l">';
  for (const [j, p] of m.p.entries()) {
    const w = (p[3] || []).join(' / ');
    h += `<div class="i"><i style="background:${col(p, j)}"></i><b>${p[0]}%</b><div class="x"><div class="n"><span>${esc(p[1])}</span>${w ? `<small>${w} г</small>` : ''}</div><div class="m">${esc(p[2])}</div></div></div>`;
  }
  h += '</div><div class="bt">';
  if (P.o) h += `<button class="o" onclick="order(${cur})">🛒 Заказать</button>`;
  h += `<button class="r${r > 0 ? ' on' : ''}" onclick="rate(${cur},1)">👍</button><button class="r${r < 0 ? ' on' : ''}" onclick="rate(${cur},-1)">👎</button></div><p class="st" id="st"></p>`;
  return h;
}

function loading() {
  const t = S && S.e ? esc(S.e) : `<b>Собираю миксы…</b><p class="d" id="ph">${PH[ph % PH.length]}</p>`;
  return `<div class="ld">${S && S.e ? '' : bowl([3, 0, 2, 1].map((c) => [25, , , , c]))}${t}</div>`;
}

function draw() {
  try { S = JSON.parse(W.chatData); } catch (e) { S = null; }
  try { P = JSON.parse(W.publicData) || {}; } catch (e) { P = {}; }
  if (W.isForward) S = { e: 'Миксы открываются в чате с ботом' };
  if (S && S.m && S.m.length) {
    if (L.t != null && L.t < S.m.length && cur == 0) cur = L.t;
    A.innerHTML = card();
  } else A.innerHTML = loading();
}

function tab(i) { cur = L.t = i; save(); draw(); }
function sw(x) { if (x0 != null && Math.abs(x - x0) > 50 && S && S.m) { const n = cur + (x < x0 ? 1 : -1); if (n >= 0 && n < S.m.length) tab(n); } x0 = null; }

function link(m) {
  const base = 'https://t.me/' + P.o, pk = (p) => (p[3] && p[3].length ? ' ' + Math.min(...p[3]) + 'g' : '');
  const full = m.p.map((p) => p[1] + ' (' + p[2] + ')' + pk(p)).join('\n'), short = m.p.map((p) => p[1] + pk(p)).join('\n');
  for (const t of ['Заказ: ' + m.t + '\n' + full, 'Заказ:\n' + full, 'Заказ: ' + m.t + '\n' + short, 'Заказ:\n' + short, 'Заказ: ' + m.t, 'Заказ']) {
    const u = base + '?text=' + encodeURIComponent(t);
    if (u.length <= 256) return u;
  }
  return base;
}

function flush() {
  const q = L.q || [];
  if (!q.length || busy) return;
  busy = 1;
  W.request(q[0]).then(() => { L.q = (L.q || []).filter((x) => x != q[0]); save(); busy = 0; flush(); },
    () => { busy = 0; clearTimeout(tm); tm = setTimeout(flush, 6000); });
}

function order(i) {
  try { W.openTelegramLink(link(S.m[i])); } catch (e) { say('Не получилось открыть чат менеджера'); return; }
  L.q = (L.q || []).filter((x) => x != 'o' + i).concat('o' + i);
  save();
  say('Открываю чат с менеджером…');
  flush();
}

function rate(i, v) {
  if (busy) return say(E.BUSY);
  busy = 1;
  say('Отправляю…');
  W.request('r' + i + (v > 0 ? '+' : '-')).then(() => {
    busy = 0; (L.r = L.r || {})[i] = v; save(); draw(); say(v > 0 ? 'Спасибо! Учтём в подборе' : 'Понял, такие будем предлагать реже'); flush();
  }, (e) => { busy = 0; say(E[e && e.code] || 'Не получилось, попробуйте ещё раз'); });
}

W.onEvent('chatDataChanged', draw);
W.onEvent('publicDataChanged', draw);
W.onEvent('activated', flush);
setInterval(() => { const e = document.getElementById('ph'); if (e) e.textContent = PH[++ph % PH.length]; }, 2500);
draw();
flush();
if (W.ready) W.ready();
</script>
